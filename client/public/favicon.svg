<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Double A Insurance favicon">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F3D27A"/>
      <stop offset="45%" stop-color="#D4A017"/>
      <stop offset="100%" stop-color="#9F7412"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#191919"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
  </defs>

  <!-- transparent background for clean website favicon use -->
  <rect width="512" height="512" rx="96" fill="transparent"/>

  <!-- outer shield -->
  <path d="M256 48
           L404 104
           V224
           C404 336 326 421 256 464
           C186 421 108 336 108 224
           V104 Z"
        fill="url(#dark)"
        stroke="url(#gold)"
        stroke-width="24"
        stroke-linejoin="round"/>

  <!-- subtle inner shield line -->
  <path d="M256 86
           L366 128
           V224
           C366 313 307 380 256 416
           C205 380 146 313 146 224
           V128 Z"
        fill="none"
        stroke="#ffffff"
        stroke-opacity="0.18"
        stroke-width="8"
        stroke-linejoin="round"/>

  <!-- monogram: big, spaced, not crammed -->
  <text x="256" y="294"
        text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="132"
        font-weight="700"
        letter-spacing="10"
        fill="#ffffff">DA</text>

  <!-- single premium accent, separated from letters -->
  <circle cx="256" cy="132" r="17" fill="url(#gold)"/>
</svg>
